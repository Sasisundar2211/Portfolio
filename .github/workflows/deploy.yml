name: Deploy Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      # This step sets up Node.js for your project
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # This step installs dependencies and builds your app
      - name: Install dependencies and build
        run: |
          npm install
          npm run build
        
      # This step uploads the contents of the 'build' folder (created by the build)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './build'

  # This job handles the deployment
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
