<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // Don't execute on the root path
      if (window.location.pathname !== '/') {
        // Get the current path part of the URL
        var path = window.location.pathname;

        // Get the repository name from the URL, which is the first segment
        // e.g., /Sasi_Portfolio/portfolio -> Sasi_Portfolio
        var repoName = path.split('/')[1];

        // Preserve the path and search query
        var redirect = window.location.protocol + '//' + window.location.host + '/' + repoName +
                       '?p=' + path +
                       '&q=' + window.location.search.substring(1);

        // Perform the redirect
        window.location.replace(redirect);
      }
    </script>
  </head>
  <body></body>
</html>
